name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check plugins/win-guard-sandbox.js
      - run: node --check plugins/win-guard-killswitch.js
      - run: npm test

  windows:
    name: launcher and installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The PowerShell scripts parse
        shell: powershell
        run: |
          foreach ($f in "install.ps1", "uninstall.ps1") {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e)
            if ($e.Count) { $e | ForEach-Object { Write-Error "$f $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
      - name: Build the launcher with the compiler that ships with Windows
        shell: cmd
        run: launcher\build.cmd "%RUNNER_TEMP%\wg-bin"
      - name: Launcher end-to-end
        run: node --test test/launcher.e2e.test.mjs
        env:
          WIN_GUARD_E2E: "1"

  # The one check that the branch rules require, so that the jobs above can change without touching the rules.
  required:
    name: required
    needs: [unit, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.unit.result }}" = "success" && test "${{ needs.windows.result }}" = "success"
