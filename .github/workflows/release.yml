name: Release

# Push a tag like v0.2.0 after the version in package.json and CHANGELOG.md is set. The tests run on Windows, then a
# GitHub release is made with the notes of that version and a zip of the files needed to install. The zip holds sources
# only: the launcher is built on the user's computer by install.ps1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Launcher end-to-end
        run: node --test test/launcher.e2e.test.mjs
        env:
          WIN_GUARD_E2E: "1"
      - name: The tag matches package.json
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Notes and zip
        shell: bash
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          name="opencode-win-guard-${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" HEAD plugins launcher install.ps1 uninstall.ps1 secrets.example.txt win-guard.example.json README.md SECURITY.md LICENSE CHANGELOG.md docs
          sha256sum "$name.zip" > "$name.zip.sha256"
      - name: GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md opencode-win-guard-*.zip opencode-win-guard-*.zip.sha256
        env:
          GH_TOKEN: ${{ github.token }}
